# Pre-commit hooks for sddp-app — prevent-early secret scanning (pipeline §3.1).
#
# This is the LOCAL, prevent-early layer: it catches secrets before a commit is
# even created, so nothing leaks into Git history. It is bypassable by design
# (`git commit --no-verify`, or a dev who never ran `pre-commit install`) — the
# enforceable, un-bypassable backstop is the CI Gitleaks scan on the pull
# request (§3.2, APP-003). Together they are the §1 prevent-early/enforce-late
# pair for TH-04.
#
# Install once per clone:  pre-commit install   (see README)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
